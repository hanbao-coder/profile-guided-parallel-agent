[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profile-guided-parallel-agent"
version = "0.27.0"
description = "A verified Worker-boundary delta agent for repository-level parallel performance patches."
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "openai>=1.68",
  "python-dotenv>=1.0",
  "scikit-learn>=1.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
