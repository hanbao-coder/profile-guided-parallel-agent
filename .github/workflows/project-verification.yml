name: Project verification

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Linux / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Verify complete research project and run tests
        run: python scripts/verify_project.py --run-tests

      - name: Run real single-node Ray smoke experiment
        run: |
          mkdir -p work
          set +e
          parallel-agent benchmark benchmarks/prime_count/workload.py \
            --size 4 \
            --workers 2 \
            --backend ray \
            --modes serial naive optimized \
            --repeats 1 \
            --warmups 0 \
            --output work/ray-smoke.json 2>&1 | tee work/ray-smoke.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## Ray smoke failure"
              echo
              echo '```text'
              tail -n 100 work/ray-smoke.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            error_tail=$(tail -n 80 work/ray-smoke.log)
            error_tail=${error_tail//'%'/'%25'}
            error_tail=${error_tail//$'\n'/'%0A'}
            error_tail=${error_tail//$'\r'/'%0D'}
            echo "::error title=Ray smoke failure::$error_tail"
          fi
          exit "$status"

      - name: Verify Ray cluster execution evidence
        run: |
          python scripts/verify_project.py \
            --ray-smoke work/ray-smoke.json

      - name: Upload Ray smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ray-smoke-${{ github.sha }}
          path: |
            work/ray-smoke.json
            work/ray-smoke.log
          if-no-files-found: warn
          retention-days: 30
